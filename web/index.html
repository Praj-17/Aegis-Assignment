<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aegis Discovery</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #131a2e;
        --panel-2: #1a233d;
        --text: #e6ebf5;
        --muted: #9aa6c0;
        --accent: #6aa6ff;
        --accent-2: #8b5cf6;
        --low: #2dd4bf;
        --medium: #facc15;
        --high: #ef4444;
        --border: #243057;
        --code-bg: #0f1632;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        min-height: 100vh;
      }
      header {
        padding: 18px 28px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, #101736 0%, var(--bg) 100%);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.5px;
      }
      header .sub {
        color: var(--muted);
        font-size: 12px;
      }
      .container {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 20px;
        padding: 20px 28px 60px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
      }
      textarea {
        width: 100%;
        height: 280px;
        background: var(--code-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        resize: vertical;
      }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button, .file-btn {
        background: var(--accent);
        color: #0a0f24;
        border: none;
        padding: 9px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      button:disabled { opacity: 0.6; cursor: progress; }
      .file-btn { display: inline-block; }
      .file-btn input { display: none; }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin-top: 10px;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 30px;
        border: 1px dashed var(--border);
        border-radius: 8px;
      }
      .agent-card {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 16px;
      }
      .agent-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      .agent-head h3 { margin: 0; font-size: 15px; }
      .pill {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .tier-LOW { background: rgba(45, 212, 191, 0.18); color: var(--low); }
      .tier-MEDIUM { background: rgba(250, 204, 21, 0.18); color: var(--medium); }
      .tier-HIGH { background: rgba(239, 68, 68, 0.18); color: var(--high); }
      .score {
        font-size: 24px;
        font-weight: 700;
      }
      .meta-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px 18px;
        margin: 10px 0;
        font-size: 12px;
      }
      .meta-grid .k { color: var(--muted); }
      .meta-grid .v { color: var(--text); word-break: break-all; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
      .chip {
        background: rgba(106, 166, 255, 0.12);
        color: var(--accent);
        border: 1px solid rgba(106, 166, 255, 0.3);
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 11px;
      }
      .chip.data { background: rgba(139, 92, 246, 0.12); color: #c4b5fd; border-color: rgba(139, 92, 246, 0.3); }
      .chip.dest { background: rgba(239, 68, 68, 0.12); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
      details {
        border-top: 1px solid var(--border);
        margin-top: 10px;
        padding-top: 10px;
      }
      details summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .evidence { font-size: 12px; margin: 6px 0; padding-left: 18px; }
      .evidence li { margin: 4px 0; }
      .finding {
        background: rgba(239, 68, 68, 0.06);
        border-left: 3px solid var(--high);
        padding: 6px 10px;
        margin: 6px 0;
        border-radius: 4px;
        font-size: 12px;
      }
      .finding.MEDIUM { border-left-color: var(--medium); background: rgba(250, 204, 21, 0.06); }
      .finding.LOW { border-left-color: var(--low); background: rgba(45, 212, 191, 0.06); }
      .factor-bars {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 8px 0;
      }
      .factor-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; }
      .factor-bar .name { width: 90px; color: var(--muted); }
      .factor-bar .track {
        flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden;
      }
      .factor-bar .fill { height: 100%; background: var(--accent); }
      .factor-bar .val { width: 40px; text-align: right; color: var(--muted); }
      .graph-host {
        margin-top: 10px;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
      }
      .graph-host svg { width: 100%; height: 280px; display: block; }
      .err {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid var(--high);
        color: #fecaca;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 14px;
        font-size: 12px;
      }
      .conflict {
        background: rgba(250, 204, 21, 0.08);
        border-left: 3px solid var(--medium);
        padding: 6px 10px;
        margin: 6px 0;
        border-radius: 4px;
        font-size: 12px;
        color: #fde68a;
      }
      .pre {
        white-space: pre-wrap;
        word-break: break-all;
        background: var(--code-bg);
        padding: 10px;
        border-radius: 6px;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #d8def0;
        max-height: 220px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Aegis Discovery</h1>
        <div class="sub">Raw signals -> canonical agents -> risk + policy with evidence</div>
      </div>
      <div class="sub" id="agent-count"></div>
    </header>

    <div class="container">
      <section class="panel">
        <h2>Input Events</h2>
        <textarea id="events-input" spellcheck="false" placeholder='Paste a JSON array of raw events (RuntimeEvent / NHIManifest / CapabilityHint / SaaSAuditEvent), or upload a file.'></textarea>
        <div class="row" style="margin-top:10px;">
          <button id="btn-run">Run pipeline</button>
          <label class="file-btn secondary">
            Upload JSON
            <input type="file" id="file-input" accept="application/json,.json" />
          </label>
          <button class="secondary" id="btn-load-sample">Load sample</button>
          <button class="secondary" id="btn-clear">Reset store</button>
        </div>
        <div class="hint">
          Tip: events can be partial. The correlator joins them on <code>nhi_id</code>,
          <code>host_id+pid</code>, <code>workload_id</code>, and a &plusmn;5 minute
          window.
        </div>
        <div id="error-box"></div>
      </section>

      <section>
        <div id="agents-list">
          <div class="empty">No agents yet. Paste events or load the sample and click "Run pipeline".</div>
        </div>
      </section>
    </div>

    <script>
      const SAMPLE = [
        {
          type: "RuntimeEvent",
          event_id: "rt-001",
          host_id: "h-12",
          pid: 4471,
          destination: "api.anthropic.com",
          tools_called: ["external_llm_call"],
          timestamp: "2026-06-03T10:00:01Z"
        },
        {
          type: "NHIManifest",
          event_id: "nhi-001",
          nhi_id: "role-aegis-shadow-agent",
          workload_id: "claims-processor",
          host_id: "h-12",
          provider: "anthropic",
          model: "claude-3.5-sonnet",
          permissions: ["aurora:read", "s3:get"],
          timestamp: "2026-06-03T10:00:03Z"
        },
        {
          type: "CapabilityHint",
          event_id: "cap-001",
          repo: "claims-processor",
          workload_id: "claims-processor",
          framework_hint: "langchain",
          imports: ["langchain", "anthropic", "boto3"],
          declared_tools: ["external_llm_call", "aurora_read"],
          timestamp: "2026-06-03T09:58:40Z"
        },
        {
          type: "SaaSAuditEvent",
          event_id: "saas-001",
          nhi_id: "role-aegis-shadow-agent",
          data_classes: ["PHI", "claims_data"],
          tools_called: ["aurora_read"],
          destination: "rds.aurora",
          timestamp: "2026-06-03T10:00:05Z"
        }
      ];

      const $ = (id) => document.getElementById(id);
      const agentsList = $("agents-list");
      const errBox = $("error-box");
      const countEl = $("agent-count");

      function showError(msg) {
        errBox.innerHTML = msg ? `<div class="err">${escapeHtml(msg)}</div>` : "";
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      async function callApi(path, init) {
        const res = await fetch(path, init);
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(`${res.status} ${res.statusText}: ${txt}`);
        }
        return res.json();
      }

      function chips(items, klass = "") {
        if (!items || items.length === 0) return "<span class='hint'>none</span>";
        return items.map((it) => `<span class="chip ${klass}">${escapeHtml(it)}</span>`).join(" ");
      }

      function factorBar(name, val) {
        const pct = Math.max(0, Math.min(100, val));
        return `<div class="factor-bar">
          <div class="name">${name}</div>
          <div class="track"><div class="fill" style="width:${pct}%"></div></div>
          <div class="val">${pct.toFixed(0)}</div>
        </div>`;
      }

      function renderGraphSvg(graph) {
        if (!graph || !graph.nodes) return "";
        const groups = { agent: [], identity: [], tool: [], data: [], destination: [], policy: [] };
        for (const n of graph.nodes) {
          (groups[n.type] || (groups[n.type] = [])).push(n);
        }
        const colOrder = ["agent", "identity", "tool", "data", "destination", "policy"];
        const colColors = {
          agent: "#6aa6ff",
          identity: "#a78bfa",
          tool: "#60a5fa",
          data: "#c4b5fd",
          destination: "#f87171",
          policy: "#34d399"
        };
        const width = 760;
        const height = 280;
        const colCount = colOrder.filter((c) => (groups[c] || []).length).length;
        const colW = width / (colCount || 1);
        const positions = {};
        let cIndex = 0;
        for (const col of colOrder) {
          const list = groups[col] || [];
          if (!list.length) continue;
          const xCenter = colW * cIndex + colW / 2;
          list.forEach((n, idx) => {
            const yStep = height / (list.length + 1);
            positions[n.id] = { x: xCenter, y: yStep * (idx + 1), label: n.label, type: n.type };
          });
          cIndex++;
        }

        let svg = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        for (const e of graph.edges) {
          const a = positions[e.source];
          const b = positions[e.target];
          if (!a || !b) continue;
          svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#3a4773" stroke-width="1"/>`;
        }
        for (const [id, p] of Object.entries(positions)) {
          const color = colColors[p.type] || "#9aa6c0";
          const label = p.label.length > 22 ? p.label.slice(0, 21) + "…" : p.label;
          svg += `<g>
            <circle cx="${p.x}" cy="${p.y}" r="6" fill="${color}" stroke="#0f1632" stroke-width="1.5"/>
            <text x="${p.x}" y="${p.y - 10}" text-anchor="middle" fill="#e6ebf5" font-size="10" font-family="ui-monospace, monospace">${escapeHtml(label)}</text>
          </g>`;
        }
        svg += "</svg>";
        return svg;
      }

      async function renderAgentCard(agent) {
        const tier = agent.risk_tier || "LOW";
        const findingsHtml = (agent.findings || [])
          .map(
            (f) => `
            <div class="finding ${f.severity}">
              <strong>${escapeHtml(f.rule_id)}</strong> &mdash; ${escapeHtml(f.description)}
              <ul class="evidence">${(f.evidence || []).map((e) => `<li>${escapeHtml(e)}</li>`).join("")}</ul>
            </div>`
          )
          .join("");

        const conflictsHtml = (agent.conflicts || [])
          .map((c) => `<div class="conflict">${escapeHtml(c.note)}</div>`)
          .join("");

        const factors = agent.risk_factors || {};
        const factorBars =
          factorBar("Scope", factors.scope ?? 0) +
          factorBar("Sensitivity", factors.sensitivity ?? 0) +
          factorBar("Autonomy", factors.autonomy ?? 0) +
          factorBar("Drift", factors.drift ?? 0);

        let graphHtml = "<div class='hint'>Loading graph…</div>";
        try {
          const graph = await callApi(`/agents/${encodeURIComponent(agent.agent_id)}/graph`);
          graphHtml = renderGraphSvg(graph);
        } catch (e) {
          graphHtml = `<div class='hint'>Graph unavailable: ${escapeHtml(e.message)}</div>`;
        }

        const card = document.createElement("div");
        card.className = "agent-card";
        card.innerHTML = `
          <div class="agent-head">
            <div>
              <h3>${escapeHtml(agent.agent_id)}</h3>
              <div class="hint">${escapeHtml(agent.workload_id || agent.nhi_id || agent.host_id || "unknown identity")}</div>
            </div>
            <div style="text-align:right;">
              <div class="score">${agent.risk_score}</div>
              <span class="pill tier-${tier}">${tier}</span>
            </div>
          </div>

          <div class="meta-grid">
            <div class="k">NHI</div><div class="v">${escapeHtml(agent.nhi_id || "-")}</div>
            <div class="k">Workload</div><div class="v">${escapeHtml(agent.workload_id || "-")}</div>
            <div class="k">Host / PID</div><div class="v">${escapeHtml((agent.host_id || "-") + (agent.pid ? " / " + agent.pid : ""))}</div>
            <div class="k">Framework</div><div class="v">${escapeHtml(agent.framework || "-")}</div>
            <div class="k">Provider</div><div class="v">${escapeHtml(agent.provider || "-")}</div>
            <div class="k">Correlation conf.</div><div class="v">${(agent.correlation_confidence ?? 0).toFixed(2)}</div>
          </div>

          <div class="hint">Tools</div>
          <div class="chips">${chips(agent.tools)}</div>
          <div class="hint">Data classes</div>
          <div class="chips">${chips(agent.data_classes, "data")}</div>
          <div class="hint">Destinations</div>
          <div class="chips">${chips(agent.destinations, "dest")}</div>

          ${conflictsHtml}

          <details open>
            <summary>Recommended policy</summary>
            <div style="margin-top:8px;">
              <strong>${escapeHtml(agent.recommended_policy || "none")}</strong>
              <span class="hint"> (confidence ${(agent.policy_confidence ?? 0).toFixed(2)})</span>
              <ul class="evidence">${(agent.evidence || []).map((e) => `<li>${escapeHtml(e)}</li>`).join("")}</ul>
            </div>
          </details>

          <details>
            <summary>Risk factors</summary>
            <div class="factor-bars" style="margin-top:8px;">${factorBars}</div>
          </details>

          ${findingsHtml ? `<details open><summary>Findings</summary><div style="margin-top:8px;">${findingsHtml}</div></details>` : ""}

          <details>
            <summary>Graph</summary>
            <div class="graph-host">${graphHtml}</div>
          </details>

          <details>
            <summary>Raw agent JSON</summary>
            <div class="pre">${escapeHtml(JSON.stringify(agent, null, 2))}</div>
          </details>
        `;
        return card;
      }

      async function refreshAgents() {
        const agents = await callApi("/agents");
        agentsList.innerHTML = "";
        countEl.textContent = `${agents.length} agent${agents.length === 1 ? "" : "s"}`;
        if (!agents.length) {
          agentsList.innerHTML = `<div class="empty">No agents yet. Paste events or load the sample and click "Run pipeline".</div>`;
          return;
        }
        for (const a of agents) {
          const card = await renderAgentCard(a);
          agentsList.appendChild(card);
        }
      }

      async function runWithText(text) {
        let payload;
        try {
          payload = JSON.parse(text);
        } catch (e) {
          showError("Input is not valid JSON: " + e.message);
          return;
        }
        showError("");
        const btn = $("btn-run");
        btn.disabled = true;
        try {
          await callApi("/events", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          });
          await refreshAgents();
        } catch (e) {
          showError(e.message);
        } finally {
          btn.disabled = false;
        }
      }

      $("btn-run").addEventListener("click", () => {
        const text = $("events-input").value.trim();
        if (!text) {
          showError("Paste some events first, or click 'Load sample'.");
          return;
        }
        runWithText(text);
      });

      $("btn-load-sample").addEventListener("click", () => {
        $("events-input").value = JSON.stringify(SAMPLE, null, 2);
      });

      $("btn-clear").addEventListener("click", async () => {
        try {
          await callApi("/events", { method: "DELETE" });
          await refreshAgents();
        } catch (e) {
          showError(e.message);
        }
      });

      $("file-input").addEventListener("change", async (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        const text = await file.text();
        $("events-input").value = text;
        runWithText(text);
      });

      refreshAgents().catch((e) => showError(e.message));
    </script>
  </body>
</html>
